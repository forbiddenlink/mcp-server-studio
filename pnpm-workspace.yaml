packages:
  - "."

allowBuilds:
  "@sentry/cli": false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver


# Supply-chain cooldown: pnpm refuses package versions published less than 7 days ago,
# the window in which worm-style npm compromises (Shai-Hulud) are usually caught and pulled.
minimumReleaseAge: 10080
